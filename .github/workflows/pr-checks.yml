name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Omoni.xcodeproj
  SCHEME: Omoni
  XCODE_VERSION: "26.3"
  IOS_RUNTIME_PREFIX: com.apple.CoreSimulator.SimRuntime.iOS-26
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
  TEST_RESULTS_PATH: ${{ github.workspace }}/TestResults/OmoniTests.xcresult

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: lint --strict

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve iOS simulator destination
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(xcrun simctl list runtimes available -j | jq -r --arg prefix "${IOS_RUNTIME_PREFIX}" '[.runtimes[] | select(.identifier | startswith($prefix)) | .identifier] | sort | last // empty')"

          if [[ -z "${runtime_id}" ]]; then
            echo "No iOS simulator runtime matching ${IOS_RUNTIME_PREFIX} was found on the runner." >&2
            exit 1
          fi

          destination="$(xcrun simctl list devices available -j | jq -r --arg runtime_id "${runtime_id}" '.devices[$runtime_id][] | select(.name | startswith("iPhone")) | "platform=iOS Simulator,id=\(.udid)"' | head -n 1)"

          if [[ -z "${destination}" ]]; then
            echo "No available iPhone simulator was found for runtime ${runtime_id}." >&2
            exit 1
          fi

          echo "runtime_id=${runtime_id}" >> "$GITHUB_OUTPUT"
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs

          xcodebuild clean build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee Logs/build.log \
            | xcbeautify

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Logs/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build"
            echo "- Xcode: ${XCODE_VERSION}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime_id }}"
            echo "- Destination: \`${{ steps.simulator.outputs.destination }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    needs: build
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve iOS simulator destination
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(xcrun simctl list runtimes available -j | jq -r --arg prefix "${IOS_RUNTIME_PREFIX}" '[.runtimes[] | select(.identifier | startswith($prefix)) | .identifier] | sort | last // empty')"

          if [[ -z "${runtime_id}" ]]; then
            echo "No iOS simulator runtime matching ${IOS_RUNTIME_PREFIX} was found on the runner." >&2
            exit 1
          fi

          destination="$(xcrun simctl list devices available -j | jq -r --arg runtime_id "${runtime_id}" '.devices[$runtime_id][] | select(.name | startswith("iPhone")) | "platform=iOS Simulator,id=\(.udid)"' | head -n 1)"

          if [[ -z "${destination}" ]]; then
            echo "No available iPhone simulator was found for runtime ${runtime_id}." >&2
            exit 1
          fi

          echo "runtime_id=${runtime_id}" >> "$GITHUB_OUTPUT"
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs "$(dirname "${TEST_RESULTS_PATH}")"

          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${TEST_RESULTS_PATH}" \
            -only-testing:OmoniTests \
            -enableCodeCoverage NO \
            -enableThreadSanitizer NO \
            -enableAddressSanitizer NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee Logs/unit-tests.log \
            | xcbeautify

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: |
            Logs/unit-tests.log
            ${{ env.TEST_RESULTS_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: Add test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Unit Tests"
            echo "- Xcode: ${XCODE_VERSION}"
            echo "- Runtime: ${{ steps.simulator.outputs.runtime_id }}"
            echo "- Destination: \`${{ steps.simulator.outputs.destination }}\`"
            echo "- Result bundle: \`${TEST_RESULTS_PATH}\`"
          } >> "$GITHUB_STEP_SUMMARY"
